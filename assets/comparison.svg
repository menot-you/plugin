<?xml version="1.0" encoding="utf-8"?><svg viewBox="0 0 1200 900" width="1200" height="900" xmlns="http://www.w3.org/2000/svg"><rect fill="#F4E8DB" width="1200" height="900"/><text fill="#252422" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="70">Two ways to shape an agent</text><rect fill="#F8EFE5" stroke="#A74726" stroke-width="2" rx="16" x="70" y="110" width="490" height="720"/><rect fill="none" stroke="#D9C9B8" stroke-width="1.5" rx="16" x="640" y="110" width="490" height="720"/><text fill="#A74726" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="26" font-weight="bold" text-anchor="middle" x="315" y="165">nSOUL</text><text fill="#9B887A" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="26" font-weight="bold" text-anchor="middle" x="885" y="165">a prompt pack</text><text fill="#252422" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="22" text-anchor="middle" x="315" y="230">skills, agents, hooks as one plugin</text><text fill="#9B887A" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="22" text-anchor="middle" x="885" y="230">a wall of instructions</text><text fill="#252422" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="22" text-anchor="middle" x="315" y="325">acts inside explicit authority</text><text fill="#9B887A" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="22" text-anchor="middle" x="885" y="325">hopes the model behaves</text><text fill="#252422" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="22" text-anchor="middle" x="315" y="420">every claim ships its proof</text><text fill="#9B887A" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="22" text-anchor="middle" x="885" y="420">trust the confident prose</text><text fill="#252422" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="22" text-anchor="middle" x="315" y="515">clone-and-own on any host</text><text fill="#9B887A" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="22" text-anchor="middle" x="885" y="515">copy-paste per project</text><text fill="#252422" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="22" text-anchor="middle" x="315" y="610">nMEMORY wired in</text><text fill="#9B887A" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="22" text-anchor="middle" x="885" y="610">bring your own everything</text></svg>