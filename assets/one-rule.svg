<?xml version="1.0" encoding="utf-8"?><svg viewBox="0 0 1600 900" width="1600" height="900" xmlns="http://www.w3.org/2000/svg"><rect fill="#F4E8DB" width="1600" height="900"/><text fill="#252422" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="32" font-weight="bold" text-anchor="middle" x="800" y="90">Every turn ends the same way</text><rect fill="#F8EFE5" stroke="#252422" stroke-width="2" rx="14" x="640" y="150" width="320" height="80"/><text fill="#252422" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="24" text-anchor="middle" x="800" y="200">one intent</text><line stroke="#62594F" stroke-width="2" x1="800" x2="300" y1="230" y2="430"/><rect fill="#F8EFE5" stroke="#A74726" stroke-width="2.5" rx="14" x="110" y="430" width="380" height="260"/><text fill="#A74726" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="26" font-weight="bold" text-anchor="middle" x="300" y="490">shipped</text><text fill="#252422" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="19" text-anchor="middle" x="300" y="545">result proven, receipt attached</text><line stroke="#62594F" stroke-width="2" x1="800" x2="800" y1="230" y2="430"/><rect fill="#F8EFE5" stroke="#A74726" stroke-width="2.5" rx="14" x="610" y="430" width="380" height="260"/><text fill="#A74726" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="26" font-weight="bold" text-anchor="middle" x="800" y="490">blocked</text><text fill="#252422" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="19" text-anchor="middle" x="800" y="545">exact gap named, nothing faked</text><line stroke="#62594F" stroke-width="2" x1="800" x2="1300" y1="230" y2="430"/><rect fill="#F8EFE5" stroke="#A74726" stroke-width="2.5" rx="14" x="1110" y="430" width="380" height="260"/><text fill="#A74726" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="26" font-weight="bold" text-anchor="middle" x="1300" y="490">handed back</text><text fill="#252422" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="19" text-anchor="middle" x="1300" y="545">one next action, pre-computed</text><text fill="#9B887A" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="20" text-anchor="middle" x="800" y="770">One visible next action. Never a menu, never false confidence.</text></svg>