name: public-release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-gates:
    name: repository-gates-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gate: ci
          - os: macos-latest
            gate: portable
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -er '.toolchain.gitleaks.version' release/public-contract.json)
          case "$(uname -s):$(uname -m)" in
            Linux:x86_64) platform=linux_x64 ;;
            Linux:aarch64|Linux:arm64) platform=linux_arm64 ;;
            Darwin:x86_64) platform=darwin_x64 ;;
            Darwin:arm64) platform=darwin_arm64 ;;
            *) printf 'unsupported Gitleaks runner: %s:%s\n' "$(uname -s)" "$(uname -m)" >&2; exit 1 ;;
          esac
          expected=$(jq -er --arg platform "$platform" '.toolchain.gitleaks.sha256[$platform]' release/public-contract.json)
          archive="gitleaks_${version}_${platform}.tar.gz"
          work=$(mktemp -d "$RUNNER_TEMP/nsoul-gitleaks.XXXXXXXX")
          trap 'rm -rf -- "$work"' EXIT HUP INT TERM
          curl -fsSLo "$work/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$work/$archive" | awk '{print $1}')
          else
            actual=$(shasum -a 256 "$work/$archive" | awk '{print $1}')
          fi
          [[ "$actual" == "$expected" ]] || { printf 'Gitleaks archive checksum mismatch\n' >&2; exit 1; }
          bin_dir="$RUNNER_TEMP/nsoul-bin"
          mkdir -p "$bin_dir"
          tar -xzf "$work/$archive" -C "$bin_dir" gitleaks
          chmod 0755 "$bin_dir/gitleaks"
          printf '%s\n' "$bin_dir" >>"$GITHUB_PATH"
      - name: Verify required local tools
        shell: bash
        run: |
          set -euo pipefail
          required=(bash git gitleaks jq)
          if [[ "${{ matrix.gate }}" != portable ]]; then required+=(shellcheck); fi
          for command_name in "${required[@]}"; do
            command -v "$command_name" >/dev/null 2>&1 || {
              printf 'missing required command: %s\n' "$command_name" >&2
              exit 1
            }
          done
      - name: Run repository gates and red controls
        shell: bash
        run: bash tools/public-release-check.sh "${{ matrix.gate }}"
